<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Iron Cardio">
<title>Iron Cardio — Today</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0A0A0B; }
  body { font-family: 'Barlow', system-ui, sans-serif; }
  input, button, textarea { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: #55555A; }
  button { -webkit-appearance: none; }
</style>
</head>
<body>
<div id="frame" style="max-width:440px;margin:0 auto;min-height:100vh;background:#0A0A0B;color:#F4F4F2;padding-bottom:60px;position:relative;">
  <noscript><div style="padding:24px;color:#F4F4F2;font-family:sans-serif;">This app needs JavaScript. Open it in Safari or Chrome (not a file preview).</div></noscript>
  <div id="topbarMount"></div>
  <div style="padding:16px;">
    <div id="viewMount"><div style="padding:48px 4px;color:#8A8A8E;font-family:'Barlow',system-ui,sans-serif;font-size:14px;">Loading today’s session…</div></div>
    <div id="timerMount"></div>
    <div id="logMount"></div>
  </div>
</div>

<script>
"use strict";
/*
  Iron Cardio — daily session renderer.
  Claude generates today.json fresh each day (Firecrawl-informed, adapted to the
  morning check-in) and pushes it. The app renders blocks[] of any shape, tracks
  done + a log, and offers a timer. Report results in chat; a new plan gets pushed.
*/

var EMBEDDED_PLAN = {
  date: "2026-07-08", weekday: "TODAY", title: "HYROX LADDER", vibe: "GREEN · HIGH INTENSITY",
  why: "Fresh start. Reopen once online to pull today’s generated session.",
  estMin: 45,
  blocks: [
    { id: "warmup", kind: "warmup", title: "WARM-UP", meta: "5 min", text: "Brisk walk 2 min · Halos · Body-pass · Goblet pry · Leg swings · Dislocates · Ankle rocks · 10 priming swings." },
    { id: "b1", kind: "strength", title: "HEAVY COUPLET", meta: "~10 min · 2×40 lb", format: "4 ROUNDS", workRest: "rest 75s", items: [ { name: "Double Front Squat", detail: "5 · 2×40 lb" }, { name: "Double Push Press", detail: "5 · 2×40 lb" } ], text: "5 + 5 back to back, rest 75s. 1–2 in reserve." },
    { id: "b2", kind: "conditioning", title: "HYROX LADDER", meta: "~18 min · for time", format: "15-12-9 + RUN", workRest: "minimal rest", items: [ { name: "Clean & Press", detail: "15/12/9 · 40 lb" }, { name: "Goblet Squat", detail: "15/12/9 · 50 lb" }, { name: "Run", detail: "0.20 mi after each round" } ], text: "15+15 then run, 12+12 then run, 9+9 then run. For time." },
    { id: "b3", kind: "finisher", title: "SWING FINISHER", meta: "~4 min", format: "40s / 20s × 4", workRest: "2:1", items: [ { name: "Two-hand Swing", detail: "40s max · 16 kg" } ], text: "4 rounds of 40s hard swings / 20s rest. Empty the tank." },
    { id: "cool", kind: "cooldown", title: "COOLDOWN", meta: "3 min", text: "Walk down + stretch hips, hams, shoulders, spine." }
  ],
  timer: { emomUnit: "reps on the top" }
};

var PLAN_CACHE_KEY = 'ic-plan-cache';
var PLAN = (function () { try { var c = localStorage.getItem(PLAN_CACHE_KEY); if (c) return JSON.parse(c); } catch (e) {} return EMBEDDED_PLAN; })();

var EMOM_WORK_SECS = 25, HAPTIC_CUE = true;
var DATE_KEY = new Date().toISOString().slice(0, 10);
var STORE_KEY = 'kb-today-' + DATE_KEY;

var state = {
  done: {}, rounds: 0,
  timer: { mode: 'circuit', running: false, startedAt: 0, acc: 0 },
  log: { result: '', run: '', feel: '', notes: '' }, logged: false
};
(function load() { try { var raw = localStorage.getItem(STORE_KEY); if (raw) { var s = JSON.parse(raw); for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) state[k] = s[k]; } } catch (e) {} })();
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function commit(m) { m(); persist(); renderAll(); }
function elapsed() { var t = state.timer; return Math.max(0, Math.floor((t.acc + (t.running ? Date.now() - t.startedAt : 0)) / 1000)); }
function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function vibeColor() {
  var v = (PLAN.vibe || '').toUpperCase();
  if (v.indexOf('RED') === 0) return '#FF4D4D';
  if (v.indexOf('YELLOW') === 0) return '#FFC53D';
  if (v.indexOf('GREEN') === 0) return '#2FBF5F';
  return '#D8FF3E';
}
var KIND = {
  warmup:      { letter: '#8A8A8E', border: '1px solid #1E1E22',   bg: '#121214', stripe: false, chip: '#8A8A8E' },
  strength:    { letter: '#D8FF3E', border: '1.5px solid #2A2A2E', bg: '#141416', stripe: '#D8FF3E', chip: '#D8FF3E' },
  conditioning:{ letter: '#D8FF3E', border: '1.5px solid #2A2A2E', bg: '#141416', stripe: false, chip: '#D8FF3E' },
  finisher:    { letter: '#FF6A2C', border: '1.5px solid #2A2A2E', bg: '#141416', stripe: '#FF6A2C', chip: '#FF6A2C' },
  cooldown:    { letter: '#8A8A8E', border: '1px solid #1E1E22',   bg: '#121214', stripe: false, chip: '#8A8A8E' },
  recovery:    { letter: '#2FBF5F', border: '1px solid #2FBF5F',   bg: '#121214', stripe: false, chip: '#2FBF5F' }
};
function kindOf(k) { return KIND[k] || KIND.conditioning; }
function checkPip(on) {
  return on
    ? '<span style="width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#D8FF3E;color:#0A0A0B;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">✓</span>'
    : '<span style="width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.5px solid #3A3A3E;"></span>';
}

function renderTopbar() {
  var vc = vibeColor();
  return '<div style="position:sticky;top:0;z-index:20;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #1E1E22;">'
  + '<div style="height:6px;background-image:repeating-linear-gradient(45deg,#151517 0 10px,#0E0E10 10px 20px);"></div>'
  + '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;gap:10px;">'
  +   '<div style="min-width:0;">'
  +     '<div style="font-family:\'Barlow Semi Condensed\';font-weight:700;font-size:12px;letter-spacing:.14em;color:#8A8A8E;">'+esc(PLAN.weekday || 'TODAY')+(PLAN.estMin ? ' · '+esc(PLAN.estMin)+' MIN' : '')+'</div>'
  +     '<div style="font-family:\'Anton\';font-size:22px;letter-spacing:.01em;line-height:1.05;margin-top:3px;">'+esc(PLAN.title)+'</div>'
  +   '</div>'
  +   (PLAN.vibe ? '<span style="flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid #2A2A2E;background:#141416;border-radius:999px;padding:7px 12px;">'
  +     '<span style="width:11px;height:11px;border-radius:50%;background:'+vc+';box-shadow:0 0 10px '+vc+';"></span>'
  +     '<span style="font-family:\'Barlow Semi Condensed\';font-weight:700;font-size:11px;letter-spacing:.08em;color:#F4F4F2;">'+esc(PLAN.vibe)+'</span></span>' : '')
  + '</div></div>';
}

function chip(text, color) {
  return '<span style="display:inline-block;font-family:\'Barlow Semi Condensed\';font-weight:700;font-size:11px;letter-spacing:.06em;color:'+color+';background:rgba(255,255,255,.04);border:1px solid #2A2A2E;border-radius:999px;padding:4px 10px;margin:0 6px 6px 0;">'+esc(text)+'</span>';
}

function renderBlocks() {
  var why = PLAN.why ? '<div style="font-size:13px;color:#9A9A9E;line-height:1.5;margin-bottom:16px;padding:0 2px;">'+esc(PLAN.why)+'</div>' : '';
  var cards = (PLAN.blocks || []).map(function (b, i) {
    var k = kindOf(b.kind), on = !!state.done[b.id], letter = String.fromCharCode(65 + i);
    var top = k.stripe ? '<div style="height:5px;background-image:repeating-linear-gradient(45deg,'+k.stripe+' 0 8px,#0A0A0B 8px 16px);opacity:.55;"></div>' : '';
    var chips = '';
    if (b.format) chips += chip(b.format, k.chip);
    if (b.workRest) chips += chip(b.workRest, '#8A8A8E');
    var items = (b.items || []).map(function (it) {
      return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid #1E1E22;">'
        + '<span style="font-weight:700;font-size:14px;color:#F4F4F2;">'+esc(it.name)+'</span>'
        + '<span style="font-family:\'Barlow Semi Condensed\';font-weight:700;font-size:13px;color:'+k.chip+';text-align:right;">'+esc(it.detail)+'</span></div>';
    }).join('');
    var body = '<div style="padding:'+(items||b.text?'2px 15px 15px':'0 15px 12px')+';">'
      + (chips ? '<div style="margin-bottom:'+(items?'6px':'2px')+';">'+chips+'</div>' : '')
      + (items ? '<div style="margin-bottom:'+(b.text?'10px':'0')+';">'+items+'</div>' : '')
      + (b.text ? '<div style="font-size:13.5px;color:#B8B8BC;line-height:1.6;">'+esc(b.text)+'</div>' : '')
      + '</div>';
    return '<div style="border:'+k.border+';border-radius:14px;background:'+k.bg+';margin-bottom:12px;overflow:hidden;">'
      + top
      + '<button data-action="done" data-sec="'+esc(b.id)+'" style="width:100%;cursor:pointer;border:none;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px 8px;text-align:left;">'
      +   '<div style="display:flex;align-items:baseline;gap:8px;min-width:0;">'
      +     '<span style="font-family:\'Anton\';font-size:13px;color:'+k.letter+';">'+letter+'</span>'
      +     '<span style="font-family:\'Anton\';font-size:18px;">'+esc(b.title)+'</span>'
      +     '<span style="color:#6A6A6E;font-size:12px;white-space:nowrap;">'+esc(b.meta || '')+'</span></div>'
      +   checkPip(on)
      + '</button>' + body + '</div>';
  }).join('');
  return why + cards;
}

function renderTimer() {
  var s = state;
  var el = elapsed(), mm = String(Math.floor(el/60)).padStart(2,'0'), ss = String(el%60).padStart(2,'0');
  var isEmom = s.timer.mode === 'emom', running = s.timer.running;
  var emomDone = el >= 1200, inMin = el % 60;
  var phaseLabel = emomDone ? 'DONE' : (inMin < EMOM_WORK_SECS ? 'WORK' : 'REST');
  var phaseColor = emomDone ? '#8A8A8E' : (phaseLabel === 'WORK' ? '#2FBF5F' : '#6A6A6E');
  var phaseWash = phaseLabel === 'WORK' ? 'rgba(47,191,95,.08)' : '#121214';
  var minute = Math.min(Math.floor(el/60)+1, 20);
  var phaseBand = isEmom
    ? '<div style="display:flex;align-items:center;justify-content:space-between;background:'+phaseWash+';border:1px solid '+phaseColor+';border-radius:10px;padding:9px 13px;margin-bottom:12px;">'
      + '<span style="font-family:\'Anton\';font-size:16px;color:'+phaseColor+';">'+phaseLabel+'</span>'
      + '<span style="font-size:12.5px;color:#C8C8CC;">Min <b style="color:#F4F4F2;">'+minute+'</b>/20</span></div>'
    : '';
  var roundCounter = !isEmom
    ? '<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;">'
      + '<button data-action="subRound" style="cursor:pointer;width:44px;height:44px;border-radius:50%;border:1.5px solid #2A2A2E;background:#141416;color:#F4F4F2;font-size:24px;line-height:1;">−</button>'
      + '<div style="text-align:center;min-width:92px;"><div style="font-family:\'Anton\';font-size:34px;line-height:1;">'+s.rounds+'</div><div style="font-size:11px;color:#6A6A6E;letter-spacing:.1em;">ROUNDS</div></div>'
      + '<button data-action="addRound" style="cursor:pointer;width:44px;height:44px;border-radius:50%;border:1.5px solid #D8FF3E;background:rgba(216,255,62,.12);color:#D8FF3E;font-size:24px;line-height:1;">+</button></div>'
    : '';
  return '<div style="border:1.5px solid #2A2A2E;border-radius:16px;background:linear-gradient(180deg,#161618,#101012);margin-top:16px;padding:16px;">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +   '<span style="font-family:\'Barlow Semi Condensed\';font-weight:700;letter-spacing:.12em;font-size:12px;color:#8A8A8E;">TIMER</span>'
    +   '<div style="display:flex;background:#0C0C0D;border:1px solid #242428;border-radius:999px;padding:3px;">'
    +     '<button data-action="setMode" data-mode="circuit" style="cursor:pointer;border:none;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:.04em;background:'+(!isEmom?'#D8FF3E':'transparent')+';color:'+(!isEmom?'#0A0A0B':'#8A8A8E')+';">STOPWATCH</button>'
    +     '<button data-action="setMode" data-mode="emom" style="cursor:pointer;border:none;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:.04em;background:'+(isEmom?'#D8FF3E':'transparent')+';color:'+(isEmom?'#0A0A0B':'#8A8A8E')+';">EMOM</button></div></div>'
    + phaseBand
    + '<div style="text-align:center;padding:6px 0 14px;"><div style="font-family:\'Anton\';font-size:76px;line-height:.9;letter-spacing:.02em;color:#F4F4F2;font-variant-numeric:tabular-nums;">'+mm+':'+ss+'</div>'
    +   '<div style="font-size:12px;color:#6A6A6E;letter-spacing:.1em;margin-top:2px;">ELAPSED</div></div>'
    + roundCounter
    + '<div style="display:flex;gap:10px;">'
    +   '<button data-action="toggleTimer" style="flex:1;cursor:pointer;border:none;border-radius:12px;padding:14px;font-family:\'Anton\';font-size:17px;letter-spacing:.04em;background:'+(running?'#FFC53D':'#D8FF3E')+';color:#0A0A0B;">'+(running?'PAUSE':'START')+'</button>'
    +   '<button data-action="resetTimer" style="cursor:pointer;border:1.5px solid #2A2A2E;border-radius:12px;padding:14px 18px;background:#141416;color:#9A9A9E;font-family:\'Anton\';font-size:17px;letter-spacing:.04em;">RESET</button></div></div>';
}

function renderLog() {
  var s = state;
  var head = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    + '<span style="font-family:\'Anton\';font-size:18px;">LOG IT</span>'
    + '<span style="font-size:11px;letter-spacing:.06em;color:#6A6A6E;">'+esc(PLAN.title || '')+'</span></div>';
  var body;
  if (!s.logged) {
    var feelDefs = [ {v:'easy',label:'EASY'}, {v:'solid',label:'SOLID'}, {v:'brutal',label:'BRUTAL'} ];
    var feelBtns = feelDefs.map(function (f) {
      var sel = s.log.feel === f.v;
      return '<button data-action="feel" data-feel="'+f.v+'" style="flex:1;cursor:pointer;border-radius:10px;padding:10px 4px;font-size:12.5px;font-weight:600;border:1.5px solid '+(sel?'#D8FF3E':'#2A2A2E')+';background:'+(sel?'rgba(216,255,62,.10)':'#0C0C0D')+';color:'+(sel?'#D8FF3E':'#8A8A8E')+';">'+f.label+'</button>';
    }).join('');
    body = '<div><div style="display:flex;gap:10px;margin-bottom:10px;">'
      + '<div style="flex:1;"><label style="display:block;font-size:11px;letter-spacing:.08em;color:#8A8A8E;font-weight:600;margin-bottom:5px;">RESULT</label>'
      +   '<input data-field="result" value="'+esc(s.log.result)+'" inputmode="text" placeholder="rounds / time / loads" style="width:100%;border:1px solid #2A2A2E;background:#0C0C0D;color:#F4F4F2;border-radius:10px;padding:11px 12px;font-size:14px;outline:none;" /></div>'
      + '<div style="flex:1;"><label style="display:block;font-size:11px;letter-spacing:.08em;color:#8A8A8E;font-weight:600;margin-bottom:5px;">RUN</label>'
      +   '<input data-field="run" value="'+esc(s.log.run)+'" inputmode="text" placeholder="e.g. 3×0.2 mi" style="width:100%;border:1px solid #2A2A2E;background:#0C0C0D;color:#F4F4F2;border-radius:10px;padding:11px 12px;font-size:14px;outline:none;" /></div></div>'
      + '<label style="display:block;font-size:11px;letter-spacing:.08em;color:#8A8A8E;font-weight:600;margin-bottom:5px;">HOW IT FELT</label>'
      + '<div style="display:flex;gap:8px;margin-bottom:10px;">'+feelBtns+'</div>'
      + '<textarea data-field="notes" placeholder="Notes — what was hard, what felt easy…" rows="2" style="width:100%;border:1px solid #2A2A2E;background:#0C0C0D;color:#F4F4F2;border-radius:10px;padding:11px 12px;font-size:14px;outline:none;resize:none;margin-bottom:12px;">'+esc(s.log.notes)+'</textarea>'
      + '<button data-action="saveLog" style="width:100%;cursor:pointer;border:none;border-radius:12px;padding:14px;font-family:\'Anton\';font-size:17px;letter-spacing:.04em;background:#D8FF3E;color:#0A0A0B;">SAVE SESSION</button></div>';
  } else {
    var summary = [ s.log.result && ('Result: '+s.log.result), s.log.run && ('Run: '+s.log.run), s.log.feel && (s.log.feel.charAt(0).toUpperCase()+s.log.feel.slice(1)) ].filter(Boolean).join(' · ') || 'Nice work.';
    body = '<div style="text-align:center;padding:10px 0 6px;">'
      + '<div style="font-family:\'Anton\';font-size:40px;color:#D8FF3E;line-height:1;">✓</div>'
      + '<div style="font-family:\'Anton\';font-size:19px;margin-top:8px;">SESSION LOGGED</div>'
      + '<div style="font-size:13px;color:#9A9A9E;margin-top:6px;line-height:1.5;">'+esc(summary)+'</div>'
      + '<div style="font-size:12px;color:#6A6A6E;margin-top:10px;line-height:1.5;">Send this to Claude in chat to shape tomorrow’s session.</div>'
      + '<button data-action="editLog" style="margin-top:12px;cursor:pointer;border:1px solid #2A2A2E;background:#141416;color:#9A9A9E;border-radius:999px;padding:9px 20px;font-size:13px;font-weight:600;">Edit</button></div>';
  }
  return '<div style="border:1px solid #1E1E22;border-radius:16px;background:#121214;margin-top:14px;padding:16px;">' + head + body + '</div>';
}

function renderAll() {
  document.getElementById('topbarMount').innerHTML = renderTopbar();
  document.getElementById('viewMount').innerHTML = renderBlocks();
  document.getElementById('timerMount').innerHTML = renderTimer();
  document.getElementById('logMount').innerHTML = renderLog();
}
var _lastMin = -1;
setInterval(function () {
  if (!state.timer.running) return;
  if (state.timer.mode === 'emom') {
    var m = Math.floor(elapsed()/60);
    if (m !== _lastMin) { _lastMin = m; if (HAPTIC_CUE && navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} } }
  }
  document.getElementById('timerMount').innerHTML = renderTimer();
}, 500);

var frame = document.getElementById('frame');
frame.addEventListener('click', function (e) {
  var btn = e.target.closest('[data-action]'); if (!btn) return;
  switch (btn.getAttribute('data-action')) {
    case 'done': { var sec = btn.getAttribute('data-sec'); commit(function(){ state.done[sec] = !state.done[sec]; }); break; }
    case 'setMode': { var mode = btn.getAttribute('data-mode'); _lastMin = -1; commit(function(){ state.timer = { mode: mode, running: false, startedAt: 0, acc: 0 }; }); break; }
    case 'toggleTimer': commit(function(){ var t = state.timer; if (t.running) { t.acc += Date.now() - t.startedAt; t.running = false; } else { t.startedAt = Date.now(); t.running = true; } }); break;
    case 'resetTimer': _lastMin = -1; commit(function(){ state.timer.running = false; state.timer.startedAt = 0; state.timer.acc = 0; }); break;
    case 'addRound': commit(function(){ state.rounds += 1; }); break;
    case 'subRound': commit(function(){ state.rounds = Math.max(0, state.rounds - 1); }); break;
    case 'feel': { var f = btn.getAttribute('data-feel'); commit(function(){ state.log.feel = f; }); break; }
    case 'saveLog': commit(function(){ state.logged = true; }); break;
    case 'editLog': commit(function(){ state.logged = false; }); break;
  }
});
frame.addEventListener('change', function (e) {
  var el = e.target.closest('[data-field]'); if (!el) return;
  var field = el.getAttribute('data-field'), val = el.value;
  commit(function(){ state.log[field] = val; });
});

renderAll();
(function fetchPlan() {
  try {
    fetch('today.json?cb=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (p) { if (p && p.blocks) { PLAN = p; try { localStorage.setItem(PLAN_CACHE_KEY, JSON.stringify(p)); } catch (e) {} renderAll(); } })
      .catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
